name: Unity Build Regression Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-regression-check:
    runs-on: ubuntu-latest
    name: Check for Build Regressions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # In a real consumer workflow, baseline and candidate Unity build logs
      # would already exist (committed, generated by a prior step, or
      # downloaded from artifact storage). This example workflow ships test
      # fixtures inline so the action has parseable input even in CI where no
      # real Unity build runs. The fixtures contain the minimal UTP blocks
      # builddiff_advanced.py expects: a PlayerBuildInfo block with duration
      # and steps, plus a "Build completed with a result" terminator so the
      # parser does not flag the log as truncated.
      - name: Create CI test fixtures
        run: |
          cat > baseline_log.txt <<'EOF'
          Built from '6000.3/staging' branch; Version is '6000.3.8f1 (1c7db571dde0)'
          Active build target changed to StandaloneWindows64
          Mono scripting backend selected
          ##utp:{"type":"ProjectInfo","version":2,"phase":"Immediate","projectLoad":145.6,"assembliesLoad":1.4,"assetDatabaseRefresh":125.5}
          ##utp:{"type":"PlayerBuildInfo","version":2,"phase":"Immediate","duration":126300,"steps":[{"description":"Compiling scripts","duration":45200},{"description":"Asset import","duration":32100},{"description":"Shader compilation","duration":28700},{"description":"Asset database refresh","duration":20300}]}
          Build completed with a result of 'Succeeded' in 126 seconds
          EOF

          cat > BaseLine_Log2.txt <<'EOF'
          Built from '6000.3/staging' branch; Version is '6000.3.8f1 (1c7db571dde0)'
          Active build target changed to StandaloneWindows64
          Mono scripting backend selected
          ##utp:{"type":"ProjectInfo","version":2,"phase":"Immediate","projectLoad":150.2,"assembliesLoad":1.5,"assetDatabaseRefresh":128.0}
          ##utp:{"type":"PlayerBuildInfo","version":2,"phase":"Immediate","duration":287600,"steps":[{"description":"Compiling scripts","duration":98400},{"description":"Asset import","duration":31900},{"description":"Shader compilation","duration":89200},{"description":"Asset database refresh","duration":68100}]}
          Build completed with a result of 'Succeeded' in 287 seconds
          EOF

      - name: Run Build Regression Check
        id: regression
        uses: DillGreen/Build-Regression-tool@v1
        with:
          baseline_log: baseline_log.txt
          candidate_log: BaseLine_Log2.txt
          fail_percent: '40'
          fail_seconds: '30'
          output_format: markdown
          track_history: 'true'

      - name: Upload HTML Report
        if: hashFiles('build_regression_report.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: build-regression-report
          path: build_regression_report.html

      - name: Post regression summary to PR
        if: github.event_name == 'pull_request' && steps.regression.outputs.regression_detected == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Build Regression Detected\n\n**Severity:** ${{ steps.regression.outputs.severity }}\n**Cause:** ${{ steps.regression.outputs.reason_code }}\n**Change:** ${{ steps.regression.outputs.percent_change }}\n\nSee uploaded artifact for full HTML report.`
            })
